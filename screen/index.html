/* ---- countdown ---- */
.cd .left{position:absolute;left:0;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center}

/* ---- etiquette ---- */

/* ---- video ---- */

/* ---- letter ---- */
#letter .photo{position:absolute;left:0;top:0;width:740px;height:560px;border-radius:32px;overflow:hidden;background:#0a2358}

/* ---- closing ---- */

body.bigLogos #botbar img{height:74px}
body.bigLogos #botbar .hosts{width:100%;justify-content:center}
/* overlays */
#confetti{position:absolute;inset:0;z-index:8;pointer-events:none}
#black{position:absolute;inset:0;background:#000;z-index:50;display:none}
#op{position:absolute;left:80px;right:80px;top:100px;bottom:110px;z-index:40;background:rgba(0,0,0,.8);border:2px solid var(--cyan-300);border-radius:24px;padding:30px;display:none;font-size:22px}
#op.on{display:block}

#skey{position:absolute;left:80px;bottom:120px;z-index:60;font-size:28px;background:rgba(0,0,0,.6);padding:8px 18px;border-radius:10px;display:none;font-family:ui-monospace,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="stage">
  <div id="bg">
    <img id="bgstill" alt="">
    <video id="bgvideo" muted loop playsinline></video>
    <canvas id="particles"></canvas>
    <div id="secbg"></div>
    <div class="grad"></div><div class="gradL"></div>
  </div>

  <div id="topbar">
    <img class="logo" id="toplogo" alt="TilonSoft">
    <div class="right"><span id="wordmark">TheOtherDay 2026</span><span id="clock">--<span class="c">:</span>--</span></div>
  </div>

  <div id="content"></div>
  <div id="dots"></div>

  <div id="botbar">
    <div class="hosts" id="hosts"></div>
  </div>

  <div id="video"><video id="vplayer" playsinline></video><div class="cap" id="vcap"></div><div class="pb"><i id="vbar"></i></div><div class="pt" id="vtime">00:00 / 00:00</div></div>
  <canvas id="confetti"></canvas>
  <div id="op"></div>
  <div id="black"></div>
  <div id="skey"></div>
  <div id="dbg"></div>
</div>

<script>
/* =====================================================================
   유틸
   ===================================================================== */
const $ = s => document.querySelector(s);
const S = DATA.settings;
const q = new URLSearchParams(location.search);
const CLEAN = q.get('clean') === '1';
const CONSOLE = q.get('console') === '1';
if (CLEAN) document.body.classList.add('clean');
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
let fakeNow = q.get('t'); // ?t=11:05 리허설용 고정 시각
function now() {
  const d = new Date();
  if (fakeNow) { const [h, m] = fakeNow.split(':').map(Number); d.setHours(h, m, Math.min(d.getSeconds(), 59)); }
  return d;
}
const nowMin = () => { const d = now(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };

/* 스테이지 스케일 */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* 아이콘 */
const ICON = {
  book: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M24 12c-4-4-10-5-16-4v26c6-1 12 0 16 4 4-4 10-5 16-4V8c-6-1-12 0-16 4z"/><path d="M24 12v26"/></svg>',
  town: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="18" cy="22" r="9"/><circle cx="30" cy="22" r="9"/><circle cx="24" cy="31" r="9"/></svg>',
  space: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M24 8l16 8-16 8-16-8z"/><path d="M8 24l16 8 16-8"/><path d="M8 32l16 8 16-8"/></svg>',
  phone: '<svg viewBox="0 0 48 48" fill="none" stroke="#4CC9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="20" height="40" rx="4"/><path d="M20 38h8"/><path d="M8 20l-3 3 3 3M8 26l-3-3"/><path d="M40 20l3 3-3 3M40 26l3-3"/></svg>',
  camera: '<svg viewBox="0 0 48 48" fill="none" stroke="#4CC9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="14" width="28" height="22" rx="4"/><path d="M32 22l12-6v18l-12-6z"/><circle cx="12" cy="20" r="2" fill="#ff4d4d" stroke="none"/></svg>',
  photo: '<svg viewBox="0 0 48 48" fill="none" stroke="#4CC9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16h8l4-6h12l4 6h8v24H6z"/><circle cx="24" cy="27" r="7"/><path d="M38 8l2 3M42 6l-2 3" /></svg>'
};
const SVC_BG = ['linear-gradient(135deg,#ff8a65,#ffd54f)', 'linear-gradient(135deg,#7c4dff,#4cc9ff)', 'linear-gradient(135deg,#00e676,#4cc9ff)'];

/* =====================================================================
   공통 프레임
   ===================================================================== */
$('#toplogo').src = DATA.event.organizer;
$('#hosts').innerHTML = `<span class="lbl">공동주최 :</span>` + DATA.event.hosts.map(h => `<img src="${h}" alt="">`).join('')
  + `<span class="sep"></span><span class="lbl">주관 :</span><img src="${DATA.event.organizer}" alt="">`;
$('#bgstill').src = S.BG_STILL;

function tickClock() {
  const d = now();
  $('#clock').innerHTML = `${pad(d.getHours())}<span class="c">:</span>${pad(d.getMinutes())}`;
}
setInterval(tickClock, 1000);

/* 배경 영상 (있으면 켜고 없으면 정지 이미지 + 파티클) */
const bgv = $('#bgvideo');
function setBgVideo(src) {
  if (!src) { bgv.classList.remove('on'); bgv.pause(); return; }
  if (bgv.getAttribute('data-src') !== src) { bgv.setAttribute('data-src', src); bgv.src = src; }
  bgv.play().then(() => bgv.classList.add('on')).catch(() => bgv.classList.remove('on'));
}
bgv.addEventListener('error', () => bgv.classList.remove('on'));

/* 파티클 웨이브 (영상 폴백·보조) */
(function particles() {
  const c = $('#particles'), ctx = c.getContext('2d');
  c.width = 1920; c.height = 1080;
  const pts = []; for (let i = 0; i < 220; i++) pts.push({ x: Math.random() * 1920, y: 0, p: Math.random() * Math.PI * 2, s: .6 + Math.random() * 1.6, v: .25 + Math.random() * .5 });
  let t = 0;
  function frame() {
    t += .006; ctx.clearRect(0, 0, 1920, 1080);
    for (const p of pts) {
      p.x += p.v; if (p.x > 1940) p.x = -20;
      const y = 560 + Math.sin(p.x / 260 + t * 3 + p.p) * 90 + Math.sin(p.x / 90 - t * 2) * 30;
      const a = .35 + .45 * Math.sin(t * 4 + p.p);
      ctx.beginPath(); ctx.arc(p.x, y, p.s, 0, Math.PI * 2); ctx.fillStyle = `rgba(120,215,255,${a})`; ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
})();

/* =====================================================================
   프로그램 계산
   ===================================================================== */
function currentProgIdx() {
  const m = nowMin();
  return DATA.program.findIndex(p => m >= toMin(p.start) && m < toMin(p.end));
}
function nextProg() {
  const m = nowMin();
  return DATA.program.find(p => toMin(p.start) > m && p.who !== undefined) || DATA.program.find(p => toMin(p.start) > m) || null;
}
function nextUpHTML() {
  const n = nextProg();
  if (!n) return `<span class="lbl">NEXT</span><span>행사가 종료되었습니다. 함께해 주셔서 감사합니다</span>`;
  const mins = Math.ceil(toMin(n.start) - nowMin());
  return `<span class="lbl">NEXT UP</span><span class="amber">${n.start}</span><span>${esc(n.title)}</span>` +
    (n.who ? `<span class="dim">· ${esc(n.who)}</span>` : '') + (mins > 0 ? `<span class="dim">· ${mins}분 후</span>` : '');
}

/* =====================================================================
   화면 템플릿
   ===================================================================== */
const V = {};

V.idle = () => {
  const e = DATA.event;
  return `<div class="left">
    <div class="title a">${esc(e.name)}</div>
    <div class="slogan a">${esc(e.slogan[0])}<span>${esc(e.slogan[1])}</span></div>
  </div>
  <div class="bottom">
    <div class="date a">2026.11.05 THU &nbsp;10:00–15:00</div>
    <div class="venue a">${esc(e.venue)}</div>
  </div>`;
};

V.about = () => {
  const e = DATA.event;
  return `<div class="left">
    <div class="head a"><span class="tag">EVENT INFO</span><span class="h1">행사 안내</span></div>
    <div class="title a">${esc(e.name)}</div>
    <div class="sub a">${esc(e.sub)}</div>
    <div class="slogan a">${esc(e.slogan[0])}<span>${esc(e.slogan[1])}</span></div>
    <div class="grid a"><div class="card"><b>DATE</b>2026. 11. 05 (목)<br>10:00 ~ 15:00</div><div class="card"><b>VENUE</b>제주 메종글래드<br>2F 크리스탈홀</div></div>
    <div class="card wide a"><span class="ar">→</span><span><span class="amber">행사장 안내</span>&nbsp; ${esc(e.venueGuide)} · 등록 데스크 홀 입구</span></div>
  </div>
  <div class="right">${e.services.map((s, i) => `<div class="card a" style="transition-delay:${i * 120}ms"><div class="svcicon" style="background:${SVC_BG[i]}">${ICON[s.icon]}</div><div><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></div></div>`).join('')}</div>`;
};

V.program = () => {
  const cur = currentProgIdx(), m = nowMin();
  const row = (p, i) => {
    const cls = i === cur ? 'now' : (toMin(p.end) <= m ? 'past' : '');

/* 컨페티 */
function confetti(ms) {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.width = 1920; c.height = 1080;
  const cols = ['#F7B32B', '#4CC9FF', '#fff', '#1C60EF', '#ff6b9d'];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * 1920, y: -20 - Math.random() * 400, vx: (Math.random() - .5) * 3, vy: 3 + Math.random() * 4, r: Math.random() * Math.PI, s: 8 + Math.random() * 10, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, 1920, 1080);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += .08; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < ms) requestAnimationFrame(f); else ctx.clearRect(0, 0, 1920, 1080);
  })(t0);
}

function cueNext(dir) {

  if (i < 0) { // 큐시트 밖 화면이면 가장 가까운 다음 간지로
    if (route === 'about' || route === 'program' || route === 'prize') return go(dir > 0 ? 'start' : 'idle');
    i = 0;
  }
  const n = Math.max(0, Math.min(CUE.length - 1, i + dir));
  go(CUE[n]);
}
let sMode = null, sTimer = null;

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (sMode !== null) {
    if (/^[0-9]$/.test(k)) { sMode += k; skey(true, 'S ' + sMode); if (sMode.length === 2) { const id = sMode; sMode = null; skey(false); clearTimeout(sTimer); go(DATA.sessions.find(x => x.id === id) ? 's/' + id : route); } return; }
    sMode = null; skey(false);
  }
  const onVideo = route === 's/07/play';
  manual = true;
  switch (k) {
    case 'ArrowRight': case 'PageDown': cueNext(1); break;
    case ' ': e.preventDefault(); if (onVideo) { const v = $('#vplayer'); v.paused ? v.play() : v.pause(); } else cueNext(1); break;
    case 'ArrowLeft': case 'PageUp': cueNext(-1); break;
    case '0': manual = false; go('idle'); if (route === 'idle') startIdleRotate(); break;
    case '1': go('about'); break; case '2': go('program'); break; case '3': go('prize'); break;
    case '4': go('start'); break; case '5': go('resume'); break; case '6': go('etiquette'); break; case '7': go('lunch'); break;
    case '8': go('prize/4'); break; case '9': go('s/16/end'); break;
    case 's': case 'S': sMode = ''; skey(true, 'S _ _'); clearTimeout(sTimer); sTimer = setTimeout(() => { sMode = null; skey(false); }, 2500); break;
    case 'f': case 'F': document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
    case 'h': case 'H': case 'o': case 'O': $('#op').classList.toggle('on'); renderOp(); break;
    case 'b': case 'B': { const b = $('#black'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; break; }
    case 'r': case 'R': if (onVideo) { const v = $('#vplayer'); v.currentTime = 0; v.play(); } break;
    case 't': case 'T': { const c = $('#clock'); c.style.visibility = c.style.visibility === 'hidden' ? '' : 'hidden'; break; }
    case 'Escape': $('#op').classList.remove('on'); break;

/* 시작 */
render(location.hash.slice(1) || 'idle');
tickClock();
</script>
